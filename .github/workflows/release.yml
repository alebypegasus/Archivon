name: Multiplatform Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }} (${{ matrix.arch_label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon (M1, M2, M3, M4)
          - os: macos-14
            arch_label: AppleSilicon
            artifact_name: Archivon-macOS-AppleSilicon.dmg
            build_script: |
              pip install -r requirements.txt pyinstaller
              chmod +x build_macos.sh
              ./build_macos.sh AppleSilicon
            asset_path: dist/Archivon-macOS-AppleSilicon.dmg

          # Windows 64-bit
          - os: windows-latest
            arch_label: Windows-x64
            artifact_name: Archivon-Windows.exe
            build_script: |
              pip install -r requirements.txt pyinstaller
              pyinstaller --noconfirm --windowed --onefile --name "Archivon-Windows" --add-data "archivon_py;archivon_py" --add-data "assets;assets" --hidden-import "PyQt6.QtSvg" --hidden-import "PyQt6.QtCore" --hidden-import "PyQt6.QtGui" --hidden-import "PyQt6.QtWidgets" --collect-all "google.generativeai" --collect-all "google.ai.generativelanguage" --collect-all "google.api_core" --collect-all "pymupdf" --collect-all "fitz" --collect-all "gdown" --copy-metadata "google-generativeai" --copy-metadata "google-ai-generativelanguage" --copy-metadata "pymupdf" --copy-metadata "gdown" --icon "assets/icon.ico" archivon_py/main.py
            asset_path: dist/Archivon-Windows.exe

          # Linux 64-bit
          - os: ubuntu-latest
            arch_label: Linux-x86_64
            artifact_name: Archivon-Linux-x86_64.tar.gz
            build_script: |
              sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3
              pip install -r requirements.txt pyinstaller
              chmod +x build_linux.sh
              ./build_linux.sh
            asset_path: dist/Archivon-Linux-x86_64.tar.gz

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Build Application
        run: ${{ matrix.build_script }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_path }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          draft: false
          prerelease: false
          generate_release_notes: true

